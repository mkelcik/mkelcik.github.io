<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mkelcik</title>
<style>
  :root { --bg: #fff; --text: #1d1d1f; --muted: #6e6e73; --accent: #0a84ff; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1e; --text: #f5f5f7; --muted: #98989f; } }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 20px; }
  h1 { font-size: 28px; margin: 0 0 24px; }
  a { color: var(--accent); }
  .project { display: flex; gap: 14px; align-items: flex-start; }
  .project img { width: 48px; height: 48px; flex: none; }
  .project p { margin: 2px 0 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>mkelcik</h1>
  <div class="project">
    <img src="https://mkelcik.github.io/do-not-forget/logo.svg" alt="">
    <div>
      <a href="https://mkelcik.github.io/do-not-forget/"><b>Do Not Forget</b></a>
      <p>Your next meeting, one glance away: a tray app for Linux, macOS and Windows with Google Calendar.</p>
    </div>
  </div>
  <p style="margin-top:40px"><a href="https://github.com/mkelcik">github.com/mkelcik</a></p>
</main>
</body>
</html>
